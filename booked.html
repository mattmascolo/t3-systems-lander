<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>T3 Systems | Booking Confirmed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900 antialiased">

  <!-- Top hairline -->
  <div class="border-t border-gray-200"></div>

  <!-- Eyebrow -->
  <div class="text-center text-xs sm:text-sm tracking-wide text-gray-600 mt-3">
    Your Booking Was Successful
  </div>

  <!-- HERO -->
  <header class="max-w-5xl mx-auto px-4 sm:px-6 pt-6 sm:pt-10">
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold leading-tight text-center">
      🎉 Thank You For <span class="text-gray-900">Booking With T3 Systems!</span>
    </h1>

    <p class="mt-4 text-center text-base sm:text-lg text-gray-700">
      We’ve received your booking — our team will reach out soon with next steps.
    </p>

    <!-- Video -->
    <div class="mt-8 sm:mt-10 relative pb-[56.25%] h-0 overflow-hidden rounded-xl shadow-xl">
      <iframe
        class="absolute inset-0 w-full h-full"
        src="https://player.vimeo.com/video/1129905878?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
        allow="autoplay; fullscreen"
        allowfullscreen
      ></iframe>
    </div>

    <!-- Back to Home / CTA -->
    <div class="mt-8 sm:mt-10 flex justify-center">
      <a href="/" 
         class="block w-full sm:w-auto text-center bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-extrabold tracking-wide text-base sm:text-lg md:text-xl py-4 px-6 sm:px-10 rounded-lg shadow-lg transition">
        RETURN TO HOME
      </a>
    </div>
  </header>

  <!-- FOOTER -->
  <footer class="bg-gray-50 border-t mt-16">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-10 text-center">
      <p class="text-[11px] text-gray-500 leading-5">
        © 2025 T3 Systems — All rights reserved.<br />
        <a href="#" class="underline hover:text-gray-700">Privacy Policy</a> —
        <a href="#" class="underline hover:text-gray-700">Terms &amp; Conditions</a>
      </p>
    </div>
  </footer>

</body>
</html>
